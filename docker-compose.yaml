version: "3.8"

services:
  taiga-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - taiga-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

  taiga-back:
    image: taigaio/taiga-back:latest
    environment:
      TAIGA_SCHEME: ${TAIGA_SCHEME}
      TAIGA_DOMAIN: ${TAIGA_DOMAIN}
      WEBSOCKETS_SCHEME: ${WEBSOCKETS_SCHEME}
      TAIGA_SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: taiga-db
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_HOST: rabbitmq
      EMAIL_BACKEND: ${EMAIL_BACKEND}
    volumes:
      - taiga-static-data:/taiga-back/static
      - taiga-media-data:/taiga-back/media
    depends_on:
      - taiga-db
      - rabbitmq
    restart: unless-stopped

  taiga-front:
    image: taigaio/taiga-front:latest
    environment:
      TAIGA_SCHEME: ${TAIGA_SCHEME}
      TAIGA_DOMAIN: ${TAIGA_DOMAIN}
    restart: unless-stopped

  #taiga-gateway:
   # image: nginx:stable-alpine
   # depends_on:
   #   - taiga-front
   #   - taiga-back
   # restart: unless-stopped

  taiga-gateway:
    image: nginx:stable-alpine
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./taiga-gateway/taiga.conf:/etc/nginx/conf.d/default.conf:ro
      - taiga-static-data:/taiga/static:ro
      - taiga-media-data:/taiga/media:ro
    depends_on:
      - taiga-front
      - taiga-back
    restart: unless-stopped

volumes:
  taiga-db-data:
  rabbitmq-data:
  taiga-static-data:
  taiga-media-data:
