version: "3.8"

services:
  taiga-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - taiga-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

  taiga-back:
    image: taigaio/taiga-back:latest
    environment:
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.mydomain.eu}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${EMAIL_FROM}
      TAIGA_SCHEME: ${TAIGA_SCHEME}
      TAIGA_DOMAIN: ${TAIGA_DOMAIN}
      WEBSOCKETS_SCHEME: ${WEBSOCKETS_SCHEME}
      TAIGA_SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: taiga-db
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_HOST: rabbitmq
      CELERY_BROKER_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/${RABBITMQ_VHOST}"
      TAIGA_EVENTS_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/${RABBITMQ_VHOST}"
    volumes:
      - taiga-static-data:/taiga-back/static
      - taiga-media-data:/taiga-back/media
    depends_on:
      - taiga-db
      - rabbitmq
    restart: unless-stopped

  taiga-front:
    image: taigaio/taiga-front:latest
    environment:
      LANGUAGE_CODE: ${LANGUAGE_CODE:-en}
      TAIGA_SCHEME: ${TAIGA_SCHEME}
      TAIGA_DOMAIN: ${TAIGA_DOMAIN}
    restart: unless-stopped

  #taiga-gateway:
   # image: nginx:stable-alpine
   # depends_on:
   #   - taiga-front
   #   - taiga-back
   # restart: unless-stopped

  taiga-gateway:
    image: nginx:stable-alpine
    ports:
      - "${PORT:-80}:80"
    volumes:
      - taiga-static-data:/taiga/static:ro
      - taiga-media-data:/taiga/media:ro
    command: >
      /bin/sh -c "printf 'server {
          listen 80 default_server;
          client_max_body_size 100M;
          charset utf-8;
          location / {
              proxy_pass http://taiga-front/;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_redirect off;
          }
          location /api/ {
              proxy_pass http://taiga-back:8000/api/;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_redirect off;
          }
          location /static/ {
              alias /taiga/static/;
              expires 30d;
          }
          location /media/ {
              alias /taiga/media/;
              expires 30d;
          }
      }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - taiga-front
      - taiga-back
    restart: unless-stopped

volumes:
  taiga-db-data:
  rabbitmq-data:
  taiga-static-data:
  taiga-media-data:
